<!--Lightbox (shown when a photo is clicked)-->
<div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-btn lightbox-close" type="button" aria-label="Close">&times;</button>
    <button class="lightbox-btn lightbox-prev" type="button" aria-label="Previous photo">&#8249;</button>
    <img class="lightbox-img" src="" alt="">
    <button class="lightbox-btn lightbox-next" type="button" aria-label="Next photo">&#8250;</button>
    <span class="lightbox-count"></span>
</div>

<script>
    const items = [...document.querySelectorAll('.gallery-item img')];
    const box = document.getElementById('lightbox');
    const boxImg = box.querySelector('.lightbox-img');
    const count = box.querySelector('.lightbox-count');
    let current = 0;

    function show(i) {
        current = (i + items.length) % items.length;
        boxImg.src = items[current].src;
        boxImg.alt = items[current].alt;
        count.textContent = (current + 1) + ' / ' + items.length;
    }

    function open(i) {
        show(i);
        box.hidden = false;
        document.body.style.overflow = 'hidden';
    }

    function close() {
        box.hidden = true;
        document.body.style.overflow = '';
    }

    items.forEach((img, i) => img.parentElement.addEventListener('click', () => open(i)));
    box.querySelector('.lightbox-close').addEventListener('click', close);
    box.querySelector('.lightbox-prev').addEventListener('click', () => show(current - 1));
    box.querySelector('.lightbox-next').addEventListener('click', () => show(current + 1));
    box.addEventListener('click', e => { if (e.target === box) close(); });

    document.addEventListener('keydown', e => {
        if (box.hidden) return;
        if (e.key === 'Escape') close();
        if (e.key === 'ArrowLeft') show(current - 1);
        if (e.key === 'ArrowRight') show(current + 1);
    });
</script>
